name: Publish Schwifty Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - export_airtable.py
      - .github/workflows/publish-rules.yml
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate complete Rules Repository
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python export_airtable.py

      - name: Verify generated JSON and alias arrays
        run: |
          python -m json.tool site/rules.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path("site/rules.json").read_text(encoding="utf-8"))
          if rules.get("schema_version") != 3:
              raise SystemExit("Expected schema_version 3")

          for collection_name in ("instrument_groups", "articulations"):
              collection = rules.get(collection_name)
              if not isinstance(collection, list):
                  raise SystemExit(f"{collection_name} must be an array")
              for item in collection:
                  aliases = item.get("aliases")
                  if not isinstance(aliases, list) or not all(
                      isinstance(alias, str) for alias in aliases
                  ):
                      raise SystemExit(
                          f"{collection_name} item {item.get('id')} has invalid aliases"
                      )
          PY

      - name: Create repository landing page
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Schwifty Rules Repository</title>' \
            '<h1>Schwifty Rules Repository</h1>' \
            '<p><a href="rules.json">Open rules.json</a></p>' \
            > site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
