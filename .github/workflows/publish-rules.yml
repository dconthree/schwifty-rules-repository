name: Publish Schwifty Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - export_airtable.py
      - .github/workflows/publish-rules.yml
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate complete Rules Repository
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python export_airtable.py

      - name: Verify generated JSON
        run: python -m json.tool site/rules.json > /dev/null

      - name: Create repository landing page
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Schwifty Rules Repository</title>' \
            '<h1>Schwifty Rules Repository</h1>' \
            '<p><a href="rules.json">Open rules.json</a></p>' \
            > site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
