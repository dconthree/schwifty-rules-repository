name: Publish Schwifty Rules - Schema 4 - Five Selectors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - export_airtable.py
      - .github/workflows/publish-rules.yml
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate Rules Repository schema 4
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python export_airtable.py

      - name: Verify generated schema 4 JSON
        run: |
          python -m json.tool site/rules.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path("site/rules.json").read_text(encoding="utf-8"))

          if list(rules)[:2] != ["generated_at", "schema_version"]:
              raise SystemExit("generated_at and schema_version must be first")
          if rules.get("schema_version") != 4:
              raise SystemExit("Expected schema_version 4")

          expected_collections = (
              "instrument_groups",
              "instruments",
              "articulations",
              "classifications",
              "vocal_types",
              "taxonomy_entries",
              "creative_mix_rules",
          )
          for collection_name in expected_collections:
              if not isinstance(rules.get(collection_name), list):
                  raise SystemExit(f"{collection_name} must be an array")

          def index(collection_name, prefix):
              result = {}
              for item in rules[collection_name]:
                  item_id = item.get("id")
                  if not isinstance(item_id, str) or not item_id.startswith(prefix):
                      raise SystemExit(
                          f"{collection_name} contains an invalid ID: {item_id!r}"
                      )
                  if item_id in result:
                      raise SystemExit(f"Duplicate ID: {item_id}")
                  result[item_id] = item
              return result

          groups = index("instrument_groups", "ig_")
          instruments = index("instruments", "inst_")
          articulations = index("articulations", "art_")
          classifications = index("classifications", "class_")
          vocal_types = index("vocal_types", "lyr_")
          taxonomy = index("taxonomy_entries", "tax_")
          creative_rules = index("creative_mix_rules", "rule_")

          for collection_name in ("instruments", "articulations"):
              for item in rules[collection_name]:
                  aliases = item.get("aliases")
                  if not isinstance(aliases, list) or not all(
                      isinstance(alias, str) for alias in aliases
                  ):
                      raise SystemExit(
                          f"{collection_name} item {item.get('id')} has invalid aliases"
                      )

          for instrument in instruments.values():
              if instrument.get("instrument_group_id") not in groups:
                  raise SystemExit(
                      f"Instrument {instrument['id']} has an invalid instrument_group_id"
                  )

          for entry in taxonomy.values():
              instrument = instruments.get(entry.get("instrument_id"))
              if instrument is None:
                  raise SystemExit(
                      f"Taxonomy entry {entry['id']} has an invalid instrument_id"
                  )
              if entry.get("instrument_group_id") != instrument.get(
                  "instrument_group_id"
              ):
                  raise SystemExit(
                      f"Taxonomy entry {entry['id']} has an inconsistent instrument group"
                  )
              articulation_id = entry.get("articulation_id")
              if articulation_id is not None and articulation_id not in articulations:
                  raise SystemExit(
                      f"Taxonomy entry {entry['id']} has an invalid articulation_id"
                  )
              if entry.get("classification_id") not in classifications:
                  raise SystemExit(
                      f"Taxonomy entry {entry['id']} has an invalid classification_id"
                  )
              if entry.get("vocal_type_id") not in vocal_types:
                  raise SystemExit(
                      f"Taxonomy entry {entry['id']} has an invalid vocal_type_id"
                  )

          selector_indexes = {
              "classification_ids": classifications,
              "instrument_group_ids": groups,
              "instrument_ids": instruments,
              "articulation_ids": articulations,
              "taxonomy_entry_ids": taxonomy,
          }
          for rule in creative_rules.values():
              selector_count = 0
              for field_name, valid_ids in selector_indexes.items():
                  values = rule.get(field_name)
                  if not isinstance(values, list):
                      raise SystemExit(
                          f"Creative rule {rule['id']} has invalid {field_name}"
                      )
                  if any(value not in valid_ids for value in values):
                      raise SystemExit(
                          f"Creative rule {rule['id']} has an unknown selector"
                      )
                  selector_count += len(values)
              if not 1 <= selector_count <= 5:
                  raise SystemExit(
                      f"Creative rule {rule['id']} must have 1-5 selectors"
                  )
          PY

      - name: Create repository landing page
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Schwifty Rules Repository - Schema 4</title>' \
            '<h1>Schwifty Rules Repository</h1>' \
            '<p>Schema version 4</p>' \
            '<p><a href="rules.json">Open rules.json</a></p>' \
            > site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
